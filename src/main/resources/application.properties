spring.application.name=taskboard
app.version=@project.version@

# Connexion PostgreSQL — surchargee par variables d'environnement (compose, K8s)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskboard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taskboard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:taskboard}

# Schema gere par JPA — volontairement simple pour l'Initiation (Flyway = niveau Avance)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sante : /actuator/health + sondes K8s /liveness et /readiness
# Sante + metriques Prometheus (lues a l'Atelier 3) exposees par defaut
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

server.shutdown=graceful

# ── Branche dokub (formation Kubernetes, les essentiels) ─────────────────────
# Bandeau d'annonce affiché en haut de page ; vide = pas de bandeau (lab 5 : ConfigMap)
app.banner=${APP_BANNER:}
# Variante fichier : chemin d'un fichier relu à chaque requête (ConfigMap montée en volume)
app.banner-file=${APP_BANNER_FILE:}
# Contrôle de configuration de la v3 (lab 7) : voir FeatureConfigHealthIndicator
app.feature.required=${APP_FEATURE_REQUIRED:false}
app.feature.url=${FEATURE_URL:}
# La readiness tient compte de ce contrôle ; la liveness, non :
# une configuration manquante ne doit pas faire redémarrer le conteneur en boucle.
management.endpoint.health.group.readiness.include=readinessState,featureConfig
# Détails visibles (curl /actuator/health/readiness) : utile au diagnostic en lab
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
