spring.application.name=taskboard
app.version=@project.version@

# Connexion PostgreSQL — surchargee par variables d'environnement (compose, K8s)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskboard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taskboard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:taskboard}

# Schema gere par JPA — volontairement simple pour l'Initiation (Flyway = niveau Avance)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sante : /actuator/health + sondes K8s /liveness et /readiness
# Sante + metriques Prometheus (lues a l'Atelier 3) exposees par defaut
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

server.shutdown=graceful
